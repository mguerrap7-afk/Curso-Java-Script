<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Product App</title>

    <!-- Bootswatch Cosmo Theme -->
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootswatch/4.5.2/cosmo/bootstrap.min.css"
    />

    <link rel="stylesheet" href="App.css" />
  </head>

  <body>
    <nav class="navbar navbar-dark bg-dark">
      <a class="navbar-brand" href="#">App productos</a>
    </nav>

    <div class="container">
      <div id="App" class="row pt-5">
        <div class="col-md-4">
          <div class="card">
            <div class="card-header">
              <h4>Agrega un producto</h4>
            </div>

            <form id="product-form" class="card-body">
              <div class="form-group">
                <input
                  type="text"
                  id="nombre"
                  placeholder="Nombre del producto"
                  class="form-control"
                />
              </div>

              <div class="form-group">
                <input
                  type="number"
                  id="precio"
                  step="0.01"
                  placeholder="Precio Q"
                  class="form-control"
                />
              </div>

              <div class="form-group">
                <input
                  type="number"
                  id="año"
                  min="1900"
                  max="2099"
                  step="1"
                  value="2026"
                  placeholder="Año"
                  class="form-control"
                />
              </div>

              <input
                type="submit"
                value="Subir"
                class="btn btn-primary btn-block"
              />
            </form>
          </div>
        </div>

        <div id="product-list" class="col-md-8"></div>
      </div>
    </div>

    <script src="App.js" type="module"></script>
  </body>
</html>
